spring.application.name=iso8583-client
server.port=8081

# Minimal Actuator Configuration
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Authorization Configuration
iso8583.client.authorization.enabled=true

# ActiveMQ Configuration
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=
spring.activemq.password=
spring.activemq.pool.enabled=true
spring.activemq.pool.max-connections=5

# ActiveMQ Queue Configuration
activemq.queue.iso8583.request=iso8583.requests
activemq.queue.iso8583.response=iso8583.responses

# Disable OpenTelemetry for lightweight mode
management.tracing.enabled=false
otel.sdk.disabled=true
otel.instrumentation.spring-boot.enabled=false

# Logging
logging.level.com.example.iso8583=INFO
logging.level.org.springframework=WARN
logging.level.org.apache.activemq=INFO