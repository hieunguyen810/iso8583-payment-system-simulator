apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: activemq-artemis
spec:
  serviceName: activemq-artemis-headless
  replicas: 2
  selector:
    matchLabels:
      app: activemq-artemis
  template:
    metadata:
      labels:
        app: activemq-artemis
    spec:
      containers:
      - name: artemis
        image: apache/activemq-artemis:2.31.2
        ports:
        - containerPort: 61616
        - containerPort: 8161
        env:
        - name: ARTEMIS_USER
          value: "admin"
        - name: ARTEMIS_PASSWORD
          value: "admin"
        - name: ARTEMIS_MIN_MEMORY
          value: "64M"
        - name: ARTEMIS_MAX_MEMORY
          value: "256M"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"