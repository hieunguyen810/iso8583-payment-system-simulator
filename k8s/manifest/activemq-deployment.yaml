apiVersion: apps/v1
kind: Deployment
metadata:
  name: activemq
  labels:
    app: activemq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activemq
  template:
    metadata:
      labels:
        app: activemq
    spec:
      containers:
      - name: activemq
        image: apache/activemq-classic:5.18.3
        ports:
        - containerPort: 61616
          name: jms
        - containerPort: 8161
          name: web-console
        env:
        - name: ACTIVEMQ_CONFIG_MINMEMORY
          value: "64"
        - name: ACTIVEMQ_CONFIG_MAXMEMORY
          value: "256"
        - name: ACTIVEMQ_ADMIN_LOGIN
          value: "admin"
        - name: ACTIVEMQ_ADMIN_PASSCODE
          value: "admin"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: activemq-data
          mountPath: /opt/apache-activemq/data
      volumes:
      - name: activemq-data
        persistentVolumeClaim:
          claimName: activemq-pvc